[package]
name = "synly-core"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Synly 的跨平台核心库: 协议, 加密, 设备发现与能力协商"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
uniffi = ["dep:uniffi", "dep:tracing-subscriber"]

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
bincode = "1.3.3"
clap = { version = "4.5.58", features = ["derive"] }
hmac = "0.12.1"
if-addrs = "0.15.0"
lnd = { git = "https://github.com/azazo1/lnd.git", rev = "736a2142cf807767fe7c3586163d04c67e0f16f7" }
mdns-sd = "0.18.2"
rand = "0.10.0"
rcgen = { version = "0.14.7", default-features = false, features = ["crypto", "ring"] }
ring = "0.17.14"
rustls = { version = "0.23.37", default-features = false, features = ["std", "ring"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
spake2 = "0.4.0"
tokio = { version = "1.49.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"], optional = true }
uniffi = { version = "0.31", optional = true }
url = "2.5.7"
uuid = { version = "1.22.0", features = ["serde", "v4"] }
x509-parser = "0.18.1"

[dev-dependencies]
axum = "0.8.1"
serde_json = "1.0.149"
