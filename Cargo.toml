[package]
name = "synly"
version = "0.1.0"
edition = "2024"
default-run = "synly"

[features]
default = []
input-screen-mock = []
input-macos-trackpad-debug = []
input-receiver-mock = []

[[bin]]
name = "input-screen-mock"
path = "src/bin/input-screen-mock.rs"
required-features = ["input-screen-mock"]

[[bin]]
name = "input-macos-trackpad-debug"
path = "src/bin/input-macos-trackpad-debug.rs"
required-features = ["input-macos-trackpad-debug"]

[[bin]]
name = "input-receiver-mock"
path = "src/bin/input-receiver-mock.rs"
required-features = ["input-receiver-mock"]

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
bincode = "1.3.3"
clap = { version = "4.5.58", features = ["derive"] }
clipboard-rs = { version = "0.3.3", default-features = false, features = ["image"] }
dirs = "6.0.0"
filetime = "0.2.26"
hmac = "0.12.1"
ignore = "0.4"
if-addrs = "0.15.0"
lnd = { git = "https://github.com/azazo1/lnd.git", rev = "736a2142cf807767fe7c3586163d04c67e0f16f7" }
mdns-sd = "0.18.2"
notify = "8.2.0"
notify-rust = "4.18.0"
rand = "0.10.0"
rcgen = { version = "0.14.7", default-features = false, features = ["crypto", "ring"] }
ring = "0.17.14"
rustls = { version = "0.23.37", default-features = false, features = ["std", "ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
slint = "=1.17.1"
shellexpand = "3.1.2"
socket2 = { version = "0.6.3", features = ["all"] }
tokio = { version = "1.49.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
toml = "0.9.8"
tray-icon = "0.24.2"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
tracing = "0.1.41"
rfd = "0.17.2"
url = "2.5.7"
uuid = { version = "1.22.0", features = ["serde", "v4"] }
walkdir = "2.5.0"
x509-parser = "0.18.1"
spake2 = "0.4.0"

[build-dependencies]
slint-build = "=1.17.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"

[dev-dependencies]
axum = "0.8.1"
